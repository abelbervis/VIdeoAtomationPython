version: '3.8'

services:
  nasa-shorts-web:
    build: .
    image: nasa_shorts:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ENABLE_ORB=${ENABLE_ORB:-true}
      - ORB_PALETTE=${ORB_PALETTE:-cosmic}
      - ORB_POSITION=${ORB_POSITION:-presenter}
      - ORB_ANIMATION=${ORB_ANIMATION:-speaking}
    volumes:
      # Mount output folder to host machine to preserve generated videos
      - ./output:/app/output
      # Mount assets and music
      - ./assets:/app/assets


