version: '3.8'

services:
  nasa-shorts:
    build: .
    image: nasa_shorts:latest
    env_file:
      - .env
    volumes:
      # Mount output folder to your local machine to get the generated MP4s
      - ./output:/app/output
      # Mount assets and music
      - ./assets:/app/assets
      # Live sync source files so edits take effect immediately without rebuilding image
      - ./config.py:/app/config.py
      - ./main.py:/app/main.py
      - ./audio:/app/audio
      - ./video:/app/video
      - ./subtitles:/app/subtitles
      - ./utils:/app/utils
      - ./providers:/app/providers
      - ./ai:/app/ai
      - ./robo_agents:/app/robo_agents

