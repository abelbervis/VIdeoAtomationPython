<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2560" width="1440" height="2560">
  <defs>
    <radialGradient id="bgBase" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="60%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#020306"/>
    </radialGradient>
    <radialGradient id="nebulaQ" cx="30%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#00aaff" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#0044aa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#001133" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="nebulaS" cx="70%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#aa2200" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#330800" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="horizonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.0"/>
      <stop offset="30%" stop-color="#1e3a6a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d1b33" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  
  <!-- Base Dark Space -->
  <rect width="1440" height="2560" fill="url(#bgBase)"/>
  
  <!-- Left Quantum Cyan Nebula -->
  <rect width="1440" height="2560" fill="url(#nebulaQ)"/>
  
  <!-- Right Solar Amber Nebula -->
  <rect width="1440" height="2560" fill="url(#nebulaS)"/>
  
  <!-- 3D Horizon Grid Lines (Floor Perspective) -->
  <g stroke="#2a4d80" stroke-opacity="0.2" stroke-width="1.5">
    <line x1="720" y1="1700" x2="0" y2="2560"/>
    <line x1="720" y1="1700" x2="240" y2="2560"/>
    <line x1="720" y1="1700" x2="480" y2="2560"/>
    <line x1="720" y1="1700" x2="720" y2="2560"/>
    <line x1="720" y1="1700" x2="960" y2="2560"/>
    <line x1="720" y1="1700" x2="1200" y2="2560"/>
    <line x1="720" y1="1700" x2="1440" y2="2560"/>
    <!-- Horizon Transverse rings -->
    <line x1="0" y1="1750" x2="1440" y2="1750" stroke-opacity="0.08"/>
    <line x1="0" y1="1820" x2="1440" y2="1820" stroke-opacity="0.12"/>
    <line x1="0" y1="1920" x2="1440" y2="1920" stroke-opacity="0.16"/>
    <line x1="0" y1="2060" x2="1440" y2="2060" stroke-opacity="0.22"/>
    <line x1="0" y1="2260" x2="1440" y2="2260" stroke-opacity="0.28"/>
    <line x1="0" y1="2540" x2="1440" y2="2540" stroke-opacity="0.35"/>
  </g>
  
  <!-- Glowing Anchor Stars -->
  <g fill="#ffffff">
    <circle cx="260" cy="400" r="2.5" fill-opacity="0.9"/>
    <line x1="250" y1="400" x2="270" y2="400" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <line x1="260" y1="390" x2="260" y2="410" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>

    <circle cx="1180" cy="360" r="2.5" fill-opacity="0.9"/>
    <line x1="1170" y1="360" x2="1190" y2="360" stroke="#ffd700" stroke-opacity="0.6" stroke-width="1"/>
    <line x1="1180" y1="350" x2="1180" y2="370" stroke="#ffd700" stroke-opacity="0.6" stroke-width="1"/>
    
    <circle cx="720" cy="220" r="2.0" fill-opacity="0.8"/>
    <circle cx="480" cy="620" r="1.5" fill-opacity="0.6"/>
    <circle cx="960" cy="580" r="1.5" fill-opacity="0.6"/>
    <circle cx="140" cy="850" r="1.2" fill-opacity="0.5"/>
    <circle cx="1320" cy="900" r="1.2" fill-opacity="0.5"/>
  </g>
</svg>