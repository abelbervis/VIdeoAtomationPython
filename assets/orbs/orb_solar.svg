<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Multi-stage Gaussian Blur filters for radiant volumetric diffusion -->
    <filter id="ultraAura" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="80" result="blur1" />
    </filter>
    
    <filter id="softCorona" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="45" result="blur2" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur3" />
    </filter>

    <filter id="vortexDeepBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blurDeep" />
    </filter>

    <filter id="vortexSharpBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blurSharp" />
    </filter>

    <clipPath id="coreClip">
      <circle cx="500" cy="500" r="260" />
    </clipPath>

    <!-- Layer 0: Ultra-wide diffused ambient radiance -->
    <radialGradient id="outerRadiance" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#ff2200" stop-opacity="0.70" />
      <stop offset="55%" stop-color="#ff4500" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#ffae00" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#990000" stop-opacity="0.0" />
    </radialGradient>

    <!-- Layer 1: Radiant Coronal Flare Halo -->
    <radialGradient id="coronalHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.80" />
      <stop offset="35%" stop-color="#fff1a8" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#ff8800" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0.0" />
    </radialGradient>

    <!-- Layer 2: Primary Volumetric 3D Sphere Radial Gradient -->
    <radialGradient id="orbVolumetric" cx="36%" cy="32%" r="68%" fx="32%" fy="28%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="12%" stop-color="#fff1a8" stop-opacity="0.98" />
      <stop offset="38%" stop-color="#ffae00" stop-opacity="0.95" />
      <stop offset="72%" stop-color="#ff4500" stop-opacity="0.90" />
      <stop offset="92%" stop-color="#990000" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#990000" stop-opacity="0.0" />
    </radialGradient>

    <!-- Multi-Layer Fluid Plasma Vortex Gradients -->
    <!-- Vortex Core Singularity Eye -->
    <radialGradient id="vortexEye" cx="48%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#fff1a8" stop-opacity="0.80" />
      <stop offset="85%" stop-color="#ff8800" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#990000" stop-opacity="0.0" />
    </radialGradient>

    <!-- Layer 1: Primary Spiral Swirl Gradient -->
    <radialGradient id="plasmaVortex1" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fff1a8" stop-opacity="0.92" />
      <stop offset="35%" stop-color="#ff8800" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#ffae00" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#990000" stop-opacity="0.0" />
    </radialGradient>

    <!-- Layer 2: Counter-Current Fluid Swirl -->
    <radialGradient id="plasmaVortex2" cx="58%" cy="62%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.90" />
      <stop offset="30%" stop-color="#ff2200" stop-opacity="0.70" />
      <stop offset="70%" stop-color="#ff4500" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#990000" stop-opacity="0.0" />
    </radialGradient>

    <!-- Layer 3: Fluid Spiral Arm Linear Flow -->
    <linearGradient id="spiralArmGrad1" x1="10%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.90" />
      <stop offset="30%" stop-color="#fff1a8" stop-opacity="0.80" />
      <stop offset="65%" stop-color="#ff8800" stop-opacity="0.50" />
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0.0" />
    </linearGradient>

    <!-- Layer 4: Counter Spiral Arm Linear Flow -->
    <linearGradient id="spiralArmGrad2" x1="85%" y1="20%" x2="15%" y2="80%">
      <stop offset="0%" stop-color="#ff2200" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#ffae00" stop-opacity="0.65" />
      <stop offset="80%" stop-color="#990000" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#990000" stop-opacity="0.0" />
    </linearGradient>

    <!-- Layer 5: Caustic Equatorial Ring Arc -->
    <linearGradient id="causticRingGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fff1a8" stop-opacity="0.0" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#fff1a8" stop-opacity="0.90" />
      <stop offset="75%" stop-color="#ff2200" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0.0" />
    </linearGradient>

    <!-- Layer 6: Organic Specular Highlight Flare -->
    <radialGradient id="specularGleam" cx="30%" cy="26%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#fff1a8" stop-opacity="0.60" />
      <stop offset="80%" stop-color="#ffae00" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffae00" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Stage 1: Ultra-Wide Diffused Atmospheric Radiance (Environmental Illumination) -->
  <circle cx="500" cy="500" r="420" fill="url(#outerRadiance)" filter="url(#ultraAura)" />
  <circle cx="500" cy="500" r="369" fill="url(#outerRadiance)" filter="url(#softCorona)" opacity="0.9" />

  <!-- Stage 2: Concentrated Radiant Corona Ring (Intense Edge Glow) -->
  <circle cx="500" cy="500" r="350" fill="url(#coronalHalo)" filter="url(#intenseGlow)" />

  <!-- Stage 3: Main 3D Volumetric Living Core Body -->
  <circle cx="500" cy="500" r="260" fill="url(#orbVolumetric)" />

  <!-- Stage 4: Layered Fluid Internal Vortex Core (Multi-Stream Plasma Dynamo) -->
  <g clip-path="url(#coreClip)">
    <!-- Layer 4A: Deep Nebula Plasma Bed (Counter-rotating diffuse base) -->
    <ellipse cx="396" cy="416" rx="234" ry="156" fill="url(#plasmaVortex1)" filter="url(#vortexDeepBlur)" transform="rotate(45 396 416)" opacity="0.90" />
    <ellipse cx="598" cy="572" rx="208" ry="135" fill="url(#plasmaVortex2)" filter="url(#vortexDeepBlur)" transform="rotate(-35 598 572)" opacity="0.82" />
    <ellipse cx="435" cy="598" rx="182" ry="117" fill="url(#plasmaVortex1)" filter="url(#vortexDeepBlur)" transform="rotate(70 435 598)" opacity="0.70" />

    <!-- Layer 4B: Primary Fluid Vortex Spiral Arm (Clockwise Energy Stream) -->
    <path d="M 292 539 C 409 305, 578 357, 708 474 C 591 669, 435 695, 292 539 Z" fill="url(#spiralArmGrad1)" filter="url(#vortexSharpBlur)" opacity="0.75" />

    <!-- Layer 4C: Secondary Counter-Fluid Spiral Arm (Counter-Clockwise Vortex) -->
    <path d="M 357 383 C 513 292, 682 526, 617 669 C 461 578, 383 539, 357 383 Z" fill="url(#spiralArmGrad2)" filter="url(#vortexSharpBlur)" opacity="0.70" />

    <!-- Layer 4D: Inner Toroidal Caustic Ring (Equatorial Light Ribbon) -->
    <ellipse cx="500" cy="513" rx="187" ry="72" fill="url(#causticRingGrad)" filter="url(#vortexSharpBlur)" transform="rotate(-18 500 500)" opacity="0.80" />

    <!-- Layer 4E: Vortex Core Singularity Eye (Hyper-Bright Focus Center) -->
    <circle cx="485" cy="480" r="72" fill="url(#vortexEye)" filter="url(#vortexSharpBlur)" opacity="0.95" />
    <circle cx="485" cy="480" r="31" fill="#ffffff" filter="url(#vortexSharpBlur)" opacity="0.90" />

    <!-- Layer 4F: Quantum Plasma Nodes (Micro Sparkle Points) -->
    <circle cx="402" cy="443" r="10" fill="#ffffff" filter="url(#vortexSharpBlur)" opacity="0.85" />
    <circle cx="609" cy="546" r="9" fill="#fff1a8" filter="url(#vortexSharpBlur)" opacity="0.90" />
    <circle cx="448" cy="604" r="7" fill="#ffffff" filter="url(#vortexSharpBlur)" opacity="0.80" />
  </g>

  <!-- Stage 5: High-Luminance Specular Flare Accent (Glassy Light Crown) -->
  <ellipse cx="420" cy="400" rx="117" ry="84" fill="url(#specularGleam)" transform="rotate(-20 420 400)" />
</svg>