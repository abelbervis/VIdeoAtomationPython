<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Multi-stage Gaussian Blur filters for radiant volumetric diffusion -->
    <filter id="ultraAura" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="80" result="blur1" />
    </filter>
    
    <filter id="softCorona" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="45" result="blur2" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur3" />
    </filter>

    <filter id="plasmaDiffusion" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur4" />
    </filter>

    <clipPath id="coreClip">
      <circle cx="500" cy="500" r="280" />
    </clipPath>

    <!-- Layer 0: Ultra-wide diffused ambient radiance -->
    <radialGradient id="outerRadiance" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#00d4ff" stop-opacity="0.70" />
      <stop offset="55%" stop-color="#00d4ff" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#7b2cbf" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ff5400" stop-opacity="0.0" />
    </radialGradient>

    <!-- Layer 1: Radiant Coronal Flare Halo -->
    <radialGradient id="coronalHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.80" />
      <stop offset="35%" stop-color="#ff007f" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#ff007f" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.0" />
    </radialGradient>

    <!-- Layer 2: Primary Volumetric 3D Sphere Radial Gradient -->
    <radialGradient id="orbVolumetric" cx="36%" cy="32%" r="68%" fx="32%" fy="28%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="12%" stop-color="#ff007f" stop-opacity="0.98" />
      <stop offset="38%" stop-color="#7b2cbf" stop-opacity="0.95" />
      <stop offset="72%" stop-color="#00d4ff" stop-opacity="0.90" />
      <stop offset="92%" stop-color="#ff5400" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ff5400" stop-opacity="0.0" />
    </radialGradient>

    <!-- Internal Fluid Plasma Vortex Gradients -->
    <radialGradient id="plasmaVortex1" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.90" />
      <stop offset="45%" stop-color="#ff007f" stop-opacity="0.65" />
      <stop offset="85%" stop-color="#7b2cbf" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#ff5400" stop-opacity="0.0" />
    </radialGradient>

    <radialGradient id="plasmaVortex2" cx="62%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#00d4ff" stop-opacity="0.55" />
      <stop offset="80%" stop-color="#00d4ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff5400" stop-opacity="0.0" />
    </radialGradient>

    <!-- Linear Fluid Streamer Gradient -->
    <linearGradient id="fluidStreamer" x1="15%" y1="20%" x2="85%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#ff007f" stop-opacity="0.70" />
      <stop offset="70%" stop-color="#ff007f" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#ff5400" stop-opacity="0.0" />
    </linearGradient>

    <!-- Layer 3: Organic Specular Highlight Flare -->
    <radialGradient id="specularGleam" cx="30%" cy="26%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#ff007f" stop-opacity="0.60" />
      <stop offset="80%" stop-color="#7b2cbf" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Stage 1: Ultra-Wide Diffused Atmospheric Radiance (Environmental Illumination) -->
  <circle cx="500" cy="500" r="480" fill="url(#outerRadiance)" filter="url(#ultraAura)" />
  <circle cx="500" cy="500" r="422" fill="url(#outerRadiance)" filter="url(#softCorona)" opacity="0.9" />

  <!-- Stage 2: Concentrated Radiant Corona Ring (Intense Edge Glow) -->
  <circle cx="500" cy="500" r="380" fill="url(#coronalHalo)" filter="url(#intenseGlow)" />

  <!-- Stage 3: Main 3D Volumetric Living Core Body -->
  <circle cx="500" cy="500" r="280" fill="url(#orbVolumetric)" />

  <!-- Stage 4: Internal Fluid Plasma Vortex Streams & Filaments (Living Plasma Core) -->
  <g clip-path="url(#coreClip)">
    <!-- Swirling Plasma Cloud 1 -->
    <ellipse cx="374" cy="402" rx="238" ry="154" fill="url(#plasmaVortex1)" filter="url(#plasmaDiffusion)" transform="rotate(35 374 402)" opacity="0.85" />
    
    <!-- Counter-Swirling Plasma Cloud 2 -->
    <ellipse cx="612" cy="584" rx="210" ry="140" fill="url(#plasmaVortex2)" filter="url(#plasmaDiffusion)" transform="rotate(-40 612 584)" opacity="0.78" />

    <!-- Organic Fluid Plasma Filament Ribbon -->
    <path d="M 290 570 C 416 318, 556 374, 710 472 C 584 654, 444 682, 290 570 Z" fill="url(#fluidStreamer)" filter="url(#plasmaDiffusion)" opacity="0.65" />

    <!-- Secondary Harmonic Ribbon -->
    <path d="M 360 388 C 500 304, 668 556, 612 668 C 472 556, 388 528, 360 388 Z" fill="url(#plasmaVortex1)" filter="url(#plasmaDiffusion)" opacity="0.55" />
  </g>

  <!-- Stage 5: High-Luminance Specular Flare Accent (Glassy Light Crown) -->
  <ellipse cx="420" cy="400" rx="128" ry="92" fill="url(#specularGleam)" transform="rotate(-20 420 400)" />
</svg>