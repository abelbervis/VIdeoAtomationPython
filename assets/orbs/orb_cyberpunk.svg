<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filter for soft Gaussian glow diffusion -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36" result="blur" />
    </filter>
    
    <filter id="intenseAura" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="64" result="blur" />
    </filter>

    <!-- Outer Ambient Diffused Aura -->
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.85" />
      <stop offset="38%" stop-color="#00d4ff" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#00d4ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff5400" stop-opacity="0.0" />
    </radialGradient>

    <!-- Primary Volumetric 3D Sphere Radial Gradient -->
    <radialGradient id="orbVolumetric" cx="36%" cy="32%" r="68%" fx="32%" fy="28%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="12%" stop-color="#ff007f" stop-opacity="0.98" />
      <stop offset="38%" stop-color="#7b2cbf" stop-opacity="0.94" />
      <stop offset="70%" stop-color="#00d4ff" stop-opacity="0.88" />
      <stop offset="90%" stop-color="#ff5400" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ff5400" stop-opacity="0.0" />
    </radialGradient>

    <!-- Specular Flare Accent (Offset Luminous Crown) -->
    <radialGradient id="specularGleam" cx="30%" cy="26%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#ff007f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Layer 1: Wide Ambient Diffused Aura -->
  <circle cx="400" cy="400" r="384" fill="url(#auraGrad)" filter="url(#intenseAura)" />
  <circle cx="400" cy="400" r="326" fill="url(#auraGrad)" filter="url(#softGlow)" />

  <!-- Layer 2: Main 3D Volumetric Sphere Body -->
  <circle cx="400" cy="400" r="264" fill="url(#orbVolumetric)" />

  <!-- Layer 3: Organic Specular Highlight -->
  <ellipse cx="328" cy="312" rx="118" ry="88" fill="url(#specularGleam)" transform="rotate(-18 328 312)" />
</svg>