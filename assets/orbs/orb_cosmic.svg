<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Internal caustics blur filters (confined strictly within the spherical clipping boundary) -->
    <filter id="vortexDeepBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blurDeep" />
    </filter>

    <filter id="vortexSharpBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blurSharp" />
    </filter>

    <!-- Clip path defining the physical spherical glass body -->
    <clipPath id="coreClip">
      <circle cx="500" cy="500" r="240" />
    </clipPath>

    <!-- Layer 0: Ultra-Smooth Clean Environmental Radiance (Seamlessly vanishes to 0% alpha well before canvas borders) -->
    <radialGradient id="outerRadiance" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.80" />
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#ff007f" stop-opacity="0.18" />
      <stop offset="88%" stop-color="#8a2be2" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.0" />
    </radialGradient>

    <!-- Layer 1: Radiant Coronal Plasma Flare Halo -->
    <radialGradient id="coronalHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.65" />
      <stop offset="65%" stop-color="#8a2be2" stop-opacity="0.25" />
      <stop offset="90%" stop-color="#ff007f" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.0" />
    </radialGradient>

    <!-- Layer 2: Deep 3D Quantum Glass Body (High-contrast Fresnel lens with deep onyx rim) -->
    <radialGradient id="orbVolumetric" cx="36%" cy="32%" r="68%" fx="30%" fy="26%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="14%" stop-color="#00f0ff" stop-opacity="0.95" />
      <stop offset="38%" stop-color="#8a2be2" stop-opacity="0.94" />
      <stop offset="72%" stop-color="#ff007f" stop-opacity="0.98" />
      <stop offset="92%" stop-color="#120036" stop-opacity="1.0" />
      <stop offset="100%" stop-color="#020008" stop-opacity="1.0" />
    </radialGradient>

    <!-- Layer 3: Concentric Quantum Resonance Gradients -->
    <!-- Resonance Ring 1 -->
    <linearGradient id="ringGrad1" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="28%" stop-color="#00f0ff" stop-opacity="0.80" />
      <stop offset="68%" stop-color="#8a2be2" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#120036" stop-opacity="0.0" />
    </linearGradient>

    <!-- Resonance Ring 2 -->
    <linearGradient id="ringGrad2" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.90" />
      <stop offset="45%" stop-color="#8a2be2" stop-opacity="0.70" />
      <stop offset="85%" stop-color="#120036" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#120036" stop-opacity="0.0" />
    </linearGradient>

    <!-- Vortex Core Singularity Eye -->
    <radialGradient id="vortexEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="55%" stop-color="#00f0ff" stop-opacity="0.80" />
      <stop offset="85%" stop-color="#8a2be2" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#120036" stop-opacity="0.0" />
    </radialGradient>

    <!-- Equatorial Caustic Ribbon -->
    <linearGradient id="causticRibbon" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.0" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.90" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.0" />
    </linearGradient>

    <!-- Fixed 3D Glass Specular Crown (Top-Left Highlight) -->
    <radialGradient id="specularGleam" cx="30%" cy="26%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.80" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.45" />
      <stop offset="80%" stop-color="#8a2be2" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.0" />
    </radialGradient>

    <!-- Subsurface Bounce Flare (Bottom-Right) -->
    <radialGradient id="subsurfaceBounce" cx="72%" cy="74%" r="42%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#ff007f" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#120036" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Stage 1: Ultra-Smooth Diffused Atmospheric Radiance (Zero edge-bleed) -->
  <circle cx="500" cy="500" r="400" fill="url(#outerRadiance)" />

  <!-- Stage 2: Concentrated Radiant Corona Ring (Silky edge halo) -->
  <circle cx="500" cy="500" r="310" fill="url(#coronalHalo)" />

  <!-- Stage 3: Deep 3D Glass Sphere Body with Dark Fresnel Rim for Instant Background Isolation -->
  <circle cx="500" cy="500" r="240" fill="url(#orbVolumetric)" />

  <!-- Stage 4: Quantum Fluid Caustic Core (Internal Living Energy) -->
  <g clip-path="url(#coreClip)">
    <!-- Base Diffuse Fluid Bed -->
    <ellipse cx="416" cy="432" rx="211" ry="139" fill="url(#ringGrad1)" filter="url(#vortexDeepBlur)" transform="rotate(35 416 432)" opacity="0.88" />
    <ellipse cx="576" cy="557" rx="192" ry="120" fill="url(#ringGrad2)" filter="url(#vortexDeepBlur)" transform="rotate(-30 576 557)" opacity="0.82" />

    <!-- Concentric Harmonic Wave Ribbons (Interlocking Quantum Caustics) -->
    <path d="M 320 528 C 428 332, 560 380, 680 481 C 572 644, 452 668, 320 528 Z" fill="url(#ringGrad1)" filter="url(#vortexSharpBlur)" opacity="0.85" />
    
    <path d="M 380 404 C 504 320, 656 519, 596 644 C 476 560, 404 528, 380 404 Z" fill="url(#ringGrad2)" filter="url(#vortexSharpBlur)" opacity="0.80" />

    <!-- Tilted Equatorial Light Ribbon -->
    <ellipse cx="500" cy="509" rx="177" ry="57" fill="url(#causticRibbon)" filter="url(#vortexSharpBlur)" transform="rotate(-15 500 500)" opacity="0.90" />

    <!-- Concentric Singularity Light Core (Pulsing Energy Eye) -->
    <circle cx="500" cy="500" r="76" fill="url(#vortexEye)" filter="url(#vortexSharpBlur)" opacity="0.98" />
    <circle cx="500" cy="500" r="28" fill="#ffffff" filter="url(#vortexSharpBlur)" opacity="0.96" />

    <!-- Quantum Light Nodes (Micro-stars suspended inside) -->
    <circle cx="424" cy="457" r="8" fill="#ffffff" filter="url(#vortexSharpBlur)" opacity="0.90" />
    <circle cx="586" cy="536" r="7" fill="#00f0ff" filter="url(#vortexSharpBlur)" opacity="0.92" />
    <circle cx="464" cy="584" r="6" fill="#ffffff" filter="url(#vortexSharpBlur)" opacity="0.90" />
  </g>

  <!-- Stage 5: Subsurface Light Bounce (Bottom-Right Soft Depth) -->
  <circle cx="500" cy="500" r="240" fill="url(#subsurfaceBounce)" />

  <!-- Stage 6: Fixed 3D Glass Specular Crown (Anchored Top-Left Reflection) -->
  <ellipse cx="432" cy="432" rx="115" ry="78" fill="url(#specularGleam)" transform="rotate(-28 432 432)" />

  <!-- Stage 7: Optical Refraction Micro-Rim (Guarantees crisp shape definition against any background) -->
  <circle cx="500" cy="500" r="240" fill="none" stroke="#000000" stroke-width="1.8" opacity="0.80" />
  <circle cx="500" cy="500" r="239" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.60" />
</svg>