<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Multi-stage Gaussian Blur filters for radiant volumetric diffusion -->
    <filter id="ultraAura" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70" result="blur1" />
    </filter>
    
    <filter id="softCorona" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="38" result="blur2" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur3" />
    </filter>

    <filter id="vortexDeepBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blurDeep" />
    </filter>

    <filter id="vortexSharpBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blurSharp" />
    </filter>

    <clipPath id="coreClip">
      <circle cx="500" cy="500" r="260" />
    </clipPath>

    <!-- Layer 0: Ultra-wide diffused atmospheric radiance -->
    <radialGradient id="outerRadiance" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#ff007f" stop-opacity="0.30" />
      <stop offset="85%" stop-color="#8a2be2" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#120036" stop-opacity="0.0" />
    </radialGradient>

    <!-- Layer 1: Radiant Coronal Flare Halo -->
    <radialGradient id="coronalHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.70" />
      <stop offset="70%" stop-color="#8a2be2" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.0" />
    </radialGradient>

    <!-- Layer 2: Deep 3D Glass Body (Fresnel Lens Gradient) -->
    <radialGradient id="orbVolumetric" cx="38%" cy="34%" r="66%" fx="32%" fy="28%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="15%" stop-color="#00f0ff" stop-opacity="0.90" />
      <stop offset="42%" stop-color="#8a2be2" stop-opacity="0.92" />
      <stop offset="78%" stop-color="#ff007f" stop-opacity="0.96" />
      <stop offset="94%" stop-color="#120036" stop-opacity="1.0" />
      <stop offset="100%" stop-color="#020008" stop-opacity="0.90" />
    </radialGradient>

    <!-- Layer 3: Concentric Quantum Resonance Gradients -->
    <!-- Resonance Ring 1 -->
    <linearGradient id="ringGrad1" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.90" />
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#8a2be2" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#120036" stop-opacity="0.0" />
    </linearGradient>

    <!-- Resonance Ring 2 -->
    <linearGradient id="ringGrad2" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#8a2be2" stop-opacity="0.65" />
      <stop offset="85%" stop-color="#120036" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#120036" stop-opacity="0.0" />
    </linearGradient>

    <!-- Vortex Core Singularity Eye -->
    <radialGradient id="vortexEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#00f0ff" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#8a2be2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#120036" stop-opacity="0.0" />
    </radialGradient>

    <!-- Equatorial Caustic Ribbon -->
    <linearGradient id="causticRibbon" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.0" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.0" />
    </linearGradient>

    <!-- Fixed 3D Glass Specular Crown (Top-Left Highlight) -->
    <radialGradient id="specularGleam" cx="32%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.40" />
      <stop offset="80%" stop-color="#8a2be2" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.0" />
    </radialGradient>

    <!-- Subsurface Bounce Flare (Bottom-Right) -->
    <radialGradient id="subsurfaceBounce" cx="72%" cy="74%" r="40%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#ff007f" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#120036" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Stage 1: Ultra-Wide Diffused Atmospheric Radiance (Environmental Illumination) -->
  <circle cx="500" cy="500" r="440" fill="url(#outerRadiance)" filter="url(#ultraAura)" />
  <circle cx="500" cy="500" r="374" fill="url(#outerRadiance)" filter="url(#softCorona)" opacity="0.95" />

  <!-- Stage 2: Concentrated Radiant Corona Ring (Intense Edge Glow) -->
  <circle cx="500" cy="500" r="350" fill="url(#coronalHalo)" filter="url(#intenseGlow)" />

  <!-- Stage 3: Deep 3D Glass Sphere Body with Fresnel Rim -->
  <circle cx="500" cy="500" r="260" fill="url(#orbVolumetric)" />

  <!-- Stage 4: Quantum Fluid Caustic Core (Internal Living Energy) -->
  <g clip-path="url(#coreClip)">
    <!-- Base Diffuse Fluid Bed -->
    <ellipse cx="409" cy="427" rx="228" ry="150" fill="url(#ringGrad1)" filter="url(#vortexDeepBlur)" transform="rotate(35 409 427)" opacity="0.85" />
    <ellipse cx="583" cy="562" rx="208" ry="130" fill="url(#ringGrad2)" filter="url(#vortexDeepBlur)" transform="rotate(-30 583 562)" opacity="0.80" />

    <!-- Concentric Harmonic Wave Ribbons (Interlocking Quantum Caustics) -->
    <path d="M 305 531 C 422 318, 565 370, 695 480 C 578 656, 448 682, 305 531 Z" fill="url(#ringGrad1)" filter="url(#vortexSharpBlur)" opacity="0.80" />
    
    <path d="M 370 396 C 505 305, 669 520, 604 656 C 474 565, 396 531, 370 396 Z" fill="url(#ringGrad2)" filter="url(#vortexSharpBlur)" opacity="0.75" />

    <!-- Tilted Equatorial Light Ribbon -->
    <ellipse cx="500" cy="510" rx="192" ry="62" fill="url(#causticRibbon)" filter="url(#vortexSharpBlur)" transform="rotate(-15 500 500)" opacity="0.85" />

    <!-- Concentric Singularity Light Core (Pulsing Energy Eye) -->
    <circle cx="500" cy="500" r="83" fill="url(#vortexEye)" filter="url(#vortexSharpBlur)" opacity="0.95" />
    <circle cx="500" cy="500" r="31" fill="#ffffff" filter="url(#vortexSharpBlur)" opacity="0.92" />

    <!-- Quantum Light Nodes (Micro-stars suspended inside) -->
    <circle cx="417" cy="454" r="9" fill="#ffffff" filter="url(#vortexSharpBlur)" opacity="0.85" />
    <circle cx="593" cy="539" r="7" fill="#00f0ff" filter="url(#vortexSharpBlur)" opacity="0.90" />
    <circle cx="461" cy="591" r="6" fill="#ffffff" filter="url(#vortexSharpBlur)" opacity="0.85" />
  </g>

  <!-- Stage 5: Subsurface Light Bounce (Bottom-Right Soft Depth) -->
  <circle cx="500" cy="500" r="260" fill="url(#subsurfaceBounce)" />

  <!-- Stage 6: Fixed 3D Glass Specular Crown (Anchored Top-Left Reflection) -->
  <ellipse cx="427" cy="427" rx="130" ry="88" fill="url(#specularGleam)" transform="rotate(-28 427 427)" />
</svg>